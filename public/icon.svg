<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="100%" stop-color="#0C1427" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00F5FF" stroke-width="6" stroke-opacity="0.3" />

  <!-- Shield Shape -->
  <g filter="url(#neonGlow)">
    <path d="M256 64 C352 96 416 96 416 96 V256 C416 352 336 416 256 448 C176 416 96 352 96 256 V96 C96 96 160 96 256 64 Z" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="20" stroke-linejoin="round" />
    
    <!-- Inner Cyber Core -->
    <circle cx="256" cy="240" r="48" fill="#00F5FF" fill-opacity="0.2" stroke="#00F5FF" stroke-width="12" />
    <path d="M256 160 V200 M256 280 V320 M176 240 H216 M296 240 H336" stroke="#00F5FF" stroke-width="8" stroke-linecap="round" />
    <circle cx="256" cy="240" r="16" fill="#00F5FF" />
  </g>
</svg>
